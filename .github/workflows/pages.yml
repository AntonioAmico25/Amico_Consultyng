name: Deploy AMICO Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    name: Validar pacote web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar arquivos obrigatorios
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            index.html \
            sgq-manager-online/index.html \
            sgq-manager-online/dashboard.js \
            sgq-manager-online/auto-refresh.js \
            sgq-manager-online/smart-router.js \
            sgq-manager-online/central-sync.js \
            sgq-manager-foca/index.html \
            sgq-manager-foca/app.js \
            sgq-manager-foca/navigation.js \
            sgq-manager-foca/doc-manager.js \
            sgq-manager-foca/functional-fix.js \
            sgq-manager-foca/recovery.js \
            sgq-manager-foca/patch-r6.js \
            sgq-manager-foca/styles.css; do
            test -f "$f"
          done

      - name: Validar SGQ Manager Online
        shell: bash
        run: |
          set -euo pipefail
          FILE="sgq-manager-online/index.html"
          DASH="sgq-manager-online/dashboard.js"
          AUTO="sgq-manager-online/auto-refresh.js"
          ROUTER="sgq-manager-online/smart-router.js"
          CENTRAL="sgq-manager-online/central-sync.js"
          grep -q "SGQ MANAGER" "$FILE"
          grep -q "ONLINE" "$FILE"
          grep -q "Visão executiva" "$FILE"
          grep -q "Documentos e registros" "$FILE"
          grep -q "RQ 045 / Ações" "$FILE"
          grep -q "Auditorias" "$FILE"
          grep -q "Indicadores" "$FILE"
          grep -q "Riscos e oportunidades" "$FILE"
          grep -q "Agenda e alertas" "$FILE"
          grep -q "Normas e Portarias" "$FILE"
          grep -q "Histórico de Revisões" "$FILE"
          grep -q "localAutomation" "$FILE"
          grep -q "Exportar backup" "$FILE"
          grep -q "Importar" "$FILE"
          grep -q "Dashboard Executivo do SGQ" "$DASH"
          grep -q "Velocímetro" "$DASH"
          grep -q "Histograma" "$DASH"
          grep -q "Mapa vetorial" "$DASH"
          grep -q "Vetores técnicos" "$DASH"
          grep -q "CATRACA" "$DASH"
          grep -q "ELEVADOR" "$DASH"
          grep -q "Relatório consolidado" "$DASH"
          grep -q "Histórico de Revisões" "$DASH"
          grep -q "INTERVAL_MS = 60000" "$AUTO"
          grep -q "Atualização automática ativa" "$AUTO"
          grep -q "loadDocs" "$AUTO"
          grep -q "loadNorms" "$AUTO"
          grep -q "renderExecutiveDashboard" "$AUTO"
          grep -q "Classificação automática ativa" "$ROUTER"
          grep -q "detectModule" "$ROUTER"
          grep -q "classify" "$ROUTER"
          grep -q "Confiança" "$ROUTER"
          grep -q "Revisão humana necessária" "$ROUTER"
          grep -q "75%" "$ROUTER"
          grep -q "RQ 045 / Ações" "$ROUTER"
          grep -q "Normas e Portarias" "$ROUTER"
          grep -q "registerBatch" "$ROUTER"
          grep -q "sgq-core-record-admin" "$CENTRAL"
          grep -q "Fonte oficial online ativa" "$CENTRAL"
          grep -q "Supabase é a fonte oficial" "$CENTRAL"
          grep -q "pushPending" "$CENTRAL"
          grep -q "pullCentral" "$CENTRAL"
          grep -q "centralUpsert" "$CENTRAL"
          ! grep -q "manifest.webmanifest" "$FILE"
          ! grep -q "serviceWorker" "$FILE"
          ! grep -q "PWA automatizada" "$FILE"

      - name: Validar estrutura SGQ FOCA existente
        shell: bash
        run: |
          set -euo pipefail
          FILE="sgq-manager-foca/index.html"
          NAV="sgq-manager-foca/navigation.js"
          APP="sgq-manager-foca/app.js"
          DOC="sgq-manager-foca/doc-manager.js"
          FIX="sgq-manager-foca/functional-fix.js"
          for label in "Visão executiva" "Governança do Escopo" "Estratégia e contexto" "Processos e riscos" "Documentos e registros" "Indicadores" "Auditorias" "RQ 045 e planos" "Encarroçadoras e laboratórios" "Certificações" "APQP · PPAP · FMEA" "Metrologia e 5S" "Ações e melhorias" "Garantias e pós-vendas" "Usuários, LGPD e trilha" "Aplicativo e dispositivos"; do grep -q "$label" "$FILE"; done
          test "$(grep -o 'data-target=\"m[0-9][0-9]\"' "$FILE" | wc -l)" -eq 16
          grep -q "functionalMap" "$NAV"
          grep -q "Lista Mestra de Documentos" "$DOC"
          grep -q "Importar RQs" "$FIX"
          grep -q "doc-manager.js?v=20260819-r1" "$APP"

      - name: Montar pacote publico
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/sgq-manager-foca _site/sgq-manager-online
          cp index.html _site/index.html
          cp sgq-manager-online/{index.html,dashboard.js,auto-refresh.js,smart-router.js,central-sync.js} _site/sgq-manager-online/
          sed -i 's#</body>#<script src="dashboard.js?v=20260829-r2"></script><script src="auto-refresh.js?v=20260828-r1"></script><script src="smart-router.js?v=20260829-r2"></script><script src="central-sync.js?v=20260829-r2"></script></body>#' _site/sgq-manager-online/index.html
          cp sgq-manager-foca/{index.html,app.js,navigation.js,doc-manager.js,functional-fix.js,recovery.js,patch-r6.js,styles.css} _site/sgq-manager-foca/
          printf '{"commit":"%s","repository":"%s","published_at":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/release.json
          touch _site/.nojekyll

      - name: Upload pacote web
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar GitHub Pages
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verificar publicacao
    needs: deploy
    runs-on: ubuntu-latest
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Smoke test dos SGQ Managers publicados
        shell: bash
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"
          for i in {1..12}; do
            if curl -fsS "$BASE/sgq-manager-online/" -o /tmp/online.html \
              && curl -fsS "$BASE/sgq-manager-online/dashboard.js" -o /tmp/dashboard.js \
              && curl -fsS "$BASE/sgq-manager-online/auto-refresh.js" -o /tmp/auto-refresh.js \
              && curl -fsS "$BASE/sgq-manager-online/smart-router.js" -o /tmp/smart-router.js \
              && curl -fsS "$BASE/sgq-manager-online/central-sync.js" -o /tmp/central-sync.js \
              && curl -fsS "$BASE/sgq-manager-foca/" -o /tmp/foca.html \
              && curl -fsS "$BASE/release.json" -o /tmp/release.json; then
              break
            fi
            sleep 5
          done
          test -s /tmp/online.html
          test -s /tmp/dashboard.js
          test -s /tmp/auto-refresh.js
          test -s /tmp/smart-router.js
          test -s /tmp/central-sync.js
          test -s /tmp/foca.html
          test -s /tmp/release.json
          grep -q "SGQ MANAGER" /tmp/online.html
          grep -q "ONLINE" /tmp/online.html
          grep -q "Histórico de Revisões" /tmp/online.html
          grep -q "localAutomation" /tmp/online.html
          grep -q "dashboard.js?v=20260829-r2" /tmp/online.html
          grep -q "auto-refresh.js?v=20260828-r1" /tmp/online.html
          grep -q "smart-router.js?v=20260829-r2" /tmp/online.html
          grep -q "central-sync.js?v=20260829-r2" /tmp/online.html
          grep -q "Dashboard Executivo do SGQ" /tmp/dashboard.js
          grep -q "Vetores técnicos" /tmp/dashboard.js
          grep -q "CATRACA" /tmp/dashboard.js
          grep -q "ELEVADOR" /tmp/dashboard.js
          grep -q "Relatório consolidado" /tmp/dashboard.js
          grep -q "INTERVAL_MS = 60000" /tmp/auto-refresh.js
          grep -q "Atualização automática ativa" /tmp/auto-refresh.js
          grep -q "Classificação automática ativa" /tmp/smart-router.js
          grep -q "Confiança" /tmp/smart-router.js
          grep -q "Revisão humana necessária" /tmp/smart-router.js
          grep -q "detectModule" /tmp/smart-router.js
          grep -q "registerBatch" /tmp/smart-router.js
          grep -q "sgq-core-record-admin" /tmp/central-sync.js
          grep -q "Fonte oficial online ativa" /tmp/central-sync.js
          grep -q "Supabase é a fonte oficial" /tmp/central-sync.js
          grep -q "centralUpsert" /tmp/central-sync.js
          ! grep -q "manifest.webmanifest" /tmp/online.html
          ! grep -q "serviceWorker" /tmp/online.html
          grep -q "SGQ Manager FOCA" /tmp/foca.html
          grep -q "$GITHUB_SHA" /tmp/release.json

      - name: Publicar status verde
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner,repo: context.repo.repo,sha:context.sha,state:'success',context:'pages/smoke-test',description:'SGQ Online com Supabase como fonte oficial dos modulos centrais',target_url:process.env.PAGE_URL})

      - name: Publicar status vermelho
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner,repo: context.repo.repo,sha:context.sha,state:'failure',context:'pages/smoke-test',description:'Falha na publicacao ou validacao dos SGQ Managers',target_url:process.env.PAGE_URL})