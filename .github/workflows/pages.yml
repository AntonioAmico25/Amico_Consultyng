name: Deploy AMICO Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    name: Validar pacote web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar arquivos obrigatorios
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f sgq-manager-foca/index.html
          test -f sgq-manager-foca/app.js
          test -f sgq-manager-foca/navigation.js
          test -f sgq-manager-foca/recovery.js
          test -f sgq-manager-foca/patch-r6.js
          test -f sgq-manager-foca/styles.css

      - name: Validar estrutura modular do SGQ Manager
        shell: bash
        run: |
          set -euo pipefail
          FILE="sgq-manager-foca/index.html"
          NAV="sgq-manager-foca/navigation.js"
          APP="sgq-manager-foca/app.js"
          grep -q "Visão executiva" "$FILE"
          grep -q "Governança do Escopo" "$FILE"
          grep -q "Estratégia e contexto" "$FILE"
          grep -q "Processos e riscos" "$FILE"
          grep -q "Documentos e registros" "$FILE"
          grep -q "Indicadores" "$FILE"
          grep -q "Auditorias" "$FILE"
          grep -q "RQ 045 e planos" "$FILE"
          grep -q "Encarroçadoras e laboratórios" "$FILE"
          grep -q "Certificações" "$FILE"
          grep -q "APQP · PPAP · FMEA" "$FILE"
          grep -q "Metrologia e 5S" "$FILE"
          grep -q "Ações e melhorias" "$FILE"
          grep -q "Garantias e pós-vendas" "$FILE"
          grep -q "Usuários, LGPD e trilha" "$FILE"
          grep -q "Aplicativo e dispositivos" "$FILE"
          test "$(grep -o 'data-target=\"m[0-9][0-9]\"' "$FILE" | wc -l)" -eq 16
          grep -q "m17','Controles integrados" "$NAV"
          grep -q "m18','Planilhas" "$NAV"
          grep -q "m19','Alertas" "$NAV"
          grep -q "m20','Agenda SGQ" "$NAV"
          grep -q "m21','Histórico / Audit Log" "$NAV"
          grep -q "m22','Importar RQs" "$NAV"
          grep -q "m23','Portais" "$NAV"
          grep -q "m24','Central de Agentes IA" "$NAV"
          grep -q "m25','Administração" "$NAV"
          grep -q "m26','Configurações" "$NAV"
          grep -q "sgqOpenDocument" "$NAV"
          grep -q "navigation.js?v=20260818-r10" "$APP"

      - name: Montar pacote publico
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/sgq-manager-foca
          cp index.html _site/index.html
          cp sgq-manager-foca/index.html _site/sgq-manager-foca/index.html
          cp sgq-manager-foca/app.js _site/sgq-manager-foca/app.js
          cp sgq-manager-foca/navigation.js _site/sgq-manager-foca/navigation.js
          cp sgq-manager-foca/recovery.js _site/sgq-manager-foca/recovery.js
          cp sgq-manager-foca/patch-r6.js _site/sgq-manager-foca/patch-r6.js
          cp sgq-manager-foca/styles.css _site/sgq-manager-foca/styles.css
          printf '{"commit":"%s","repository":"%s","published_at":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/release.json
          touch _site/.nojekyll

      - name: Upload pacote web
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar GitHub Pages
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Registrar URL publicada
        run: echo "Publicado em ${{ steps.deployment.outputs.page_url }}"

  verify:
    name: Verificar publicacao
    needs: deploy
    runs-on: ubuntu-latest
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Validar SGQ Manager publicado
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"
          for i in {1..12}; do
            if curl -fsS "$BASE/sgq-manager-foca/" -o /tmp/sgq.html && \
               curl -fsS "$BASE/sgq-manager-foca/app.js" -o /tmp/app.js && \
               curl -fsS "$BASE/sgq-manager-foca/navigation.js" -o /tmp/navigation.js && \
               curl -fsS "$BASE/release.json" -o /tmp/release.json; then
              break
            fi
            sleep 5
          done
          test -s /tmp/sgq.html
          test -s /tmp/app.js
          test -s /tmp/navigation.js
          test -s /tmp/release.json
          grep -q "SGQ Manager FOCA" /tmp/sgq.html
          grep -q "m26','Configurações" /tmp/navigation.js
          grep -q "sgqOpenDocument" /tmp/navigation.js
          grep -q "navigation.js?v=20260818-r10" /tmp/app.js
          grep -q "$GITHUB_SHA" /tmp/release.json
          echo "Smoke test aprovado: $BASE/sgq-manager-foca/"

      - name: Publicar status verde
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner,repo: context.repo.repo,sha: context.sha,state: 'success',context: 'pages/smoke-test',description: 'SGQ Manager publicado e validado',target_url: process.env.PAGE_URL})

      - name: Publicar status vermelho
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner,repo: context.repo.repo,sha: context.sha,state: 'failure',context: 'pages/smoke-test',description: 'Falha na validacao da publicacao',target_url: process.env.PAGE_URL})
