name: Android - APK de homologacao

on:
  push:
    branches:
      - feat/android-homologacao-v0.1.0
    paths:
      - "android/**"
      - ".github/workflows/android-homologacao.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Padronizar nome
        run: cp app/build/outputs/apk/debug/app-debug.apk AMICO-Consultyng-v0.1.0-homolog.apk

      - name: Validar integridade
        run: sha256sum AMICO-Consultyng-v0.1.0-homolog.apk | tee AMICO-Consultyng-v0.1.0-homolog.apk.sha256

      - name: Publicar artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: AMICO-Consultyng-Android-v0.1.0-homolog
          path: |
            android/AMICO-Consultyng-v0.1.0-homolog.apk
            android/AMICO-Consultyng-v0.1.0-homolog.apk.sha256
          if-no-files-found: error

      - name: Publicar pre-release para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-v0.1.0-homolog --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create android-v0.1.0-homolog             AMICO-Consultyng-v0.1.0-homolog.apk             AMICO-Consultyng-v0.1.0-homolog.apk.sha256             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --prerelease             --title "AMICO Consultyng Android v0.1.0 — Homologação"             --notes "APK Android para testes do Ecossistema AMICO CONSULTYNG. Esta é uma pré-versão de homologação, não uma publicação definitiva da Google Play."
