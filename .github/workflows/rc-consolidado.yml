name: RC Consolidado

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - main
      - 'rc/**'
      - 'audit/**'

jobs:
  rc-consolidado:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and CI test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m pip install pytest
      - name: Test F4.1
        working-directory: backend
        run: python -m pytest -q
      - name: Offline homologation dataset
        working-directory: backend
        run: python scripts/run_f41.py
      - name: Structural checks
        run: |
          test -f docs/RC_MANIFEST.md
          test -f docs/WEB_SHELL_CORPORATIVO_BASELINE.md
          test -f backend/F4_1_RELATORIO_GO_NO_GO.md
          test -f docs/SGQ_MANAGER_RELEASE_2026-08-18.md
