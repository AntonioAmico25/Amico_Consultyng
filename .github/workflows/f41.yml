name: F4.1 Cognitive Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/f41.yml'
  push:
    branches:
      - 'audit/f41-post-merge-correction'
    paths:
      - 'backend/**'
      - '.github/workflows/f41.yml'
  workflow_dispatch:
    inputs:
      run_real:
        description: 'Executar homologação com provider real no ambiente f41-rc'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  f41-offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test F4.1
        run: pytest -q
      - name: Offline homologation dataset
        run: python scripts/run_f41.py --provider deterministic --model offline-f41 --out f41_report.json

  f41-rc-real:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_real == true) || (github.event_name == 'pull_request' && github.head_ref == 'audit/f41-post-merge-correction') }}
    needs: f41-offline
    runs-on: ubuntu-latest
    environment: f41-rc
    defaults:
      run:
        working-directory: backend
    env:
      AMICO_OPENAI_API_KEY: ${{ secrets.AMICO_OPENAI_API_KEY }}
      AMICO_F41_MODEL: ${{ vars.AMICO_F41_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate RC secrets
        shell: bash
        run: |
          if [ -z "$AMICO_OPENAI_API_KEY" ]; then
            echo "AMICO_OPENAI_API_KEY ausente no environment f41-rc."
            exit 10
          fi
          if [ -z "$AMICO_F41_MODEL" ]; then
            echo "AMICO_F41_MODEL ausente no environment f41-rc."
            exit 11
          fi
          echo "Credencial e modelo do RC presentes; valores secretos não serão exibidos."
      - name: Real provider homologation
        run: python scripts/run_f41.py --provider openai --model "$AMICO_F41_MODEL" --out f41_openai_report.json
