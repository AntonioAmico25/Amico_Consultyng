name: F4.1 Cognitive Gate

on:
  pull_request:
    paths:
      - 'backend/**'
  push:
    branches:
      - 'feat/f4-1-homologacao-cognitiva'
    paths:
      - 'backend/**'

jobs:
  f41:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test F4.1
        run: pytest -q
      - name: Offline homologation dataset
        run: python scripts/run_f41.py --provider deterministic --model offline-f41 --out f41_report.json
